<style>
/* ===== My Dubai Arts — design tokens ===== */
:root {
  --ivory: #faf6ef;
  --cream: #f1e8da;
  --sand: #e3d3bd;
  --taupe: #8a7765;
  --taupe-dark: #5f5144;
  --ink: #1a1714;
  --gold: #b38b4d;
  --gold-soft: #d9c29a;
  --bronze: #7a5b2c;
  --line: rgba(26, 23, 20, 0.14);

  --serif: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --sans: 'Jost', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;

  --wrap: 1240px;
  --gutter: clamp(1.1rem, 4vw, 2.5rem);
  --section: clamp(4rem, 9vw, 7.5rem);
  --header-h: 72px;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-padding-top: calc(var(--header-h) + 12px);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--ivory);
  color: var(--ink);
  font-family: var(--sans);
  font-weight: 400;
  font-size: 1.0625rem;
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

body.no-scroll {
  overflow: hidden;
}

img {
  display: block;
  max-width: 100%;
  height: auto;
}

button,
input,
select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  background: none;
  border: 0;
  padding: 0;
}

a {
  color: inherit;
}

p {
  margin: 0;
}

h1,
h2,
h3 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 400;
  line-height: 1.08;
  letter-spacing: -0.01em;
}

:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.skip-link {
  position: absolute;
  left: 1rem;
  top: -100px;
  z-index: 100;
  background: var(--ink);
  color: var(--ivory);
  padding: 0.6rem 1rem;
}

.skip-link:focus {
  top: 1rem;
}

.container {
  width: 100%;
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 0 var(--gutter);
}

.section {
  padding: var(--section) 0;
}

.section-head {
  max-width: 640px;
  margin-bottom: clamp(2rem, 4vw, 3rem);
}

.section-head--row {
  max-width: none;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1.5rem;
  flex-wrap: wrap;
}

.section-title {
  font-size: clamp(2rem, 4.2vw, 3.1rem);
}

.section-sub {
  margin-top: 0.8rem;
  color: var(--taupe-dark);
  max-width: 56ch;
}

/* ===== Buttons ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.55rem;
  min-height: 50px;
  padding: 0.8rem 1.6rem;
  border: 1px solid transparent;
  font-family: var(--sans);
  font-size: 0.98rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  text-decoration: none;
  transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
  white-space: nowrap;
}

.btn--dark {
  background: var(--ink);
  color: var(--ivory);
}

.btn--dark:hover {
  background: var(--taupe-dark);
}

.btn--outline {
  border-color: var(--ink);
  color: var(--ink);
}

.btn--outline:hover {
  background: var(--ink);
  color: var(--ivory);
}

.btn--wa {
  background: var(--bronze);
  color: #fffaf2;
}

.btn--wa:hover {
  background: #5e451f;
}

.btn--sm {
  min-height: 46px;
  padding: 0.6rem 0.9rem;
  font-size: 0.9rem;
}

.btn--lg {
  min-height: 58px;
  font-size: 1.05rem;
  padding: 0.9rem 1.8rem;
}

.btn--block {
  width: 100%;
}

.link-btn {
  text-decoration: underline;
  text-underline-offset: 4px;
  color: var(--taupe-dark);
  min-height: 44px;
}

/* ===== Header ===== */
.header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--ivory);
  border-bottom: 1px solid transparent;
  transition: border-color 0.3s ease;
}

.header.is-scrolled {
  border-bottom-color: var(--line);
}

.header__inner {
  height: var(--header-h);
  display: flex;
  align-items: center;
  gap: 2rem;
}

.wordmark {
  font-family: var(--serif);
  font-size: 1.55rem;
  text-decoration: none;
  white-space: nowrap;
  letter-spacing: 0.01em;
}

.wordmark__my {
  font-style: italic;
  color: var(--gold);
}

.nav {
  display: flex;
  gap: 1.8rem;
  margin-left: auto;
}

.nav__link {
  font-size: 0.95rem;
  padding: 0.5rem 0;
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s ease;
}

.nav__link:hover {
  border-bottom-color: var(--gold);
}

.header__cta {
  min-height: 44px;
  padding: 0.6rem 1.3rem;
}

.header__toggle {
  display: none;
  margin-left: auto;
  width: 48px;
  height: 48px;
  align-items: center;
  justify-content: center;
}

.mobile-menu {
  display: none;
}

@media (max-width: 900px) {
  .nav,
  .header__cta {
    display: none;
  }

  .header__toggle {
    display: inline-flex;
  }

  .mobile-menu.is-open {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    position: fixed;
    inset: var(--header-h) 0 0 0;
    z-index: 45;
    background: var(--ivory);
    padding: 1.5rem var(--gutter) 2rem;
    overflow-y: auto;
  }

  .mobile-menu__link {
    text-align: left;
    font-family: var(--serif);
    font-size: 1.9rem;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
  }

  .mobile-menu .btn {
    margin-top: 1.5rem;
  }
}

/* ===== Hero ===== */
.hero {
  padding: clamp(2rem, 5vw, 4.5rem) 0 var(--section);
  background: linear-gradient(180deg, var(--ivory) 0%, var(--cream) 100%);
}

.hero__inner {
  display: grid;
  grid-template-columns: 1fr 1.05fr;
  gap: clamp(2rem, 5vw, 5rem);
  align-items: center;
}

.hero__kicker {
  color: var(--taupe-dark);
  font-size: 0.98rem;
  margin-bottom: 1.4rem;
  padding-left: 2.6rem;
  position: relative;
}

.hero__kicker::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  width: 1.9rem;
  height: 1px;
  background: var(--gold);
}

.hero__title {
  font-size: clamp(2.7rem, 6vw, 5.1rem);
  line-height: 1.02;
  max-width: 11ch;
}

.hero__text {
  margin-top: 1.5rem;
  font-size: 1.15rem;
  color: var(--taupe-dark);
  max-width: 42ch;
}

.hero__actions {
  margin-top: 2.2rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.9rem;
}

.hero__prices {
  margin-top: 2.2rem;
  display: flex;
  align-items: center;
  gap: 1.2rem;
  color: var(--taupe-dark);
  font-size: 0.95rem;
}

.hero__prices strong {
  white-space: nowrap;
  color: var(--ink);
  font-weight: 500;
  margin-left: 0.3rem;
}

.hero__prices-sep {
  width: 1px;
  height: 1.2rem;
  background: var(--line);
}

.hero__art {
  margin: 0;
  position: relative;
}

.hero__frame {
  position: relative;
  padding: clamp(0.7rem, 1.4vw, 1.1rem);
  background: var(--ivory);
  border: 1px solid var(--gold-soft);
}

.hero__frame::after {
  content: '';
  position: absolute;
  inset: clamp(0.35rem, 0.7vw, 0.55rem);
  border: 1px solid var(--gold);
  pointer-events: none;
}

.hero__frame img {
  width: 100%;
  aspect-ratio: 1.09;
  object-fit: cover;
}

.hero__caption {
  margin-top: 0.8rem;
  font-family: var(--serif);
  font-style: italic;
  color: var(--taupe);
  text-align: right;
}

/* The one orchestrated moment: the hero artwork is "unveiled" on load. */
@media (prefers-reduced-motion: no-preference) {
  .hero__frame img {
    animation: unveil 1.4s cubic-bezier(0.6, 0, 0.2, 1) both;
  }

  .hero__title,
  .hero__text,
  .hero__actions,
  .hero__prices {
    animation: rise 0.9s ease both;
  }

  .hero__text {
    animation-delay: 0.15s;
  }

  .hero__actions {
    animation-delay: 0.3s;
  }

  .hero__prices {
    animation-delay: 0.45s;
  }
}

@keyframes unveil {
  from {
    clip-path: inset(0 0 100% 0);
    transform: scale(1.06);
  }
  to {
    clip-path: inset(0 0 0 0);
    transform: scale(1);
  }
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@media (max-width: 860px) {
  .hero__inner {
    grid-template-columns: 1fr;
  }

  .hero__art {
    order: -1;
  }

  .hero__title {
    max-width: 14ch;
  }

  .hero__actions .btn {
    flex: 1 1 100%;
  }
}

/* ===== Intro ===== */
.intro__grid {
  display: grid;
  grid-template-columns: 0.9fr 1.1fr;
  gap: clamp(2.5rem, 6vw, 6rem);
  align-items: center;
}

.intro__images {
  position: relative;
  min-height: 520px;
}

.intro__img {
  position: absolute;
  object-fit: cover;
  border: 1px solid var(--gold-soft);
  padding: 0.5rem;
  background: var(--ivory);
}

.intro__img--a {
  width: 68%;
  aspect-ratio: 1;
  top: 0;
  left: 0;
}

.intro__img--b {
  width: 52%;
  aspect-ratio: 0.83;
  right: 0;
  bottom: 0;
}

.intro__lead {
  margin-top: 1.4rem;
  font-size: 1.12rem;
  color: var(--taupe-dark);
  max-width: 60ch;
}

.intro__qualities {
  margin-top: 2.5rem;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.8rem;
  border-top: 1px solid var(--line);
  padding-top: 1.8rem;
}

.quality__title {
  font-size: 1.3rem;
  line-height: 1.2;
}

.quality__text {
  margin-top: 0.6rem;
  font-size: 0.96rem;
  color: var(--taupe-dark);
}

@media (max-width: 960px) {
  .intro__grid {
    grid-template-columns: 1fr;
  }

  .intro__images {
    min-height: 0;
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 0.9rem;
    align-items: end;
  }

  .intro__img {
    position: static;
    width: 100%;
  }

  .intro__qualities {
    grid-template-columns: 1fr;
  }
}

/* ===== Featured rail ===== */
.featured {
  background: var(--cream);
}

.featured__rail {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 2.5rem 1.5rem;
}

@media (max-width: 520px) {
  .featured__rail {
    grid-template-columns: 1fr 1fr;
    gap: 2rem 0.8rem;
  }
}

/* ===== Collections ===== */
.collections__grid {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1.5rem 1.25rem;
}

.collections__grid > li:first-child {
  grid-column: span 2;
  grid-row: span 2;
}

.collection-tile {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  text-align: left;
}

.collection-tile__media {
  display: block;
  overflow: hidden;
  background: var(--sand);
  aspect-ratio: 4 / 5;
}

.collections__grid > li:first-child .collection-tile__media {
  flex: 1;
  aspect-ratio: auto;
  min-height: 320px;
}

.collections__grid > li:nth-child(6),
.collections__grid > li:nth-child(7) {
  grid-column: span 2;
}

.collections__grid > li:nth-child(6) .collection-tile__media,
.collections__grid > li:nth-child(7) .collection-tile__media {
  aspect-ratio: 16 / 9;
}

.collection-tile__media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.8s ease;
}

.collection-tile:hover .collection-tile__media img {
  transform: scale(1.04);
}

.collection-tile__body {
  display: block;
  padding-top: 0.9rem;
}

.collection-tile__name {
  display: block;
  font-family: var(--serif);
  font-size: 1.3rem;
  line-height: 1.2;
}

.collections__grid > li:first-child .collection-tile__name {
  font-size: 1.7rem;
}

.collection-tile__blurb {
  display: block;
  margin-top: 0.35rem;
  font-size: 0.92rem;
  color: var(--taupe-dark);
}

.collection-tile__count {
  display: inline-block;
  margin-top: 0.5rem;
  font-size: 0.88rem;
  color: var(--bronze);
  border-bottom: 1px solid var(--gold-soft);
}

@media (max-width: 960px) {
  .collections__grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .collections__grid > li:first-child {
    grid-row: auto;
  }

  .collections__grid > li:nth-child(6),
  .collections__grid > li:nth-child(7) {
    grid-column: auto;
  }

  .collections__grid > li:nth-child(6) .collection-tile__media,
  .collections__grid > li:nth-child(7) .collection-tile__media {
    aspect-ratio: 4 / 5;
  }

  .collections__grid > li:first-child .collection-tile__media {
    aspect-ratio: 16 / 10;
    min-height: 0;
  }
}

@media (max-width: 480px) {
  .collections__grid {
    gap: 1.25rem 0.8rem;
  }

  .collection-tile__name {
    font-size: 1.08rem;
  }

  .collection-tile__blurb {
    display: none;
  }
}

/* ===== Pricing band ===== */
.pricing {
  background: var(--ink);
  color: var(--ivory);
  padding: clamp(2.2rem, 5vw, 3rem) 0;
}

.pricing__inner {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 1.5rem 2.5rem;
  align-items: center;
}

.price-tile {
  display: flex;
  align-items: center;
  gap: 1.1rem;
}

.price-tile__swatch {
  width: 46px;
  height: 58px;
  flex: none;
  border: 6px solid;
}

.price-tile__swatch--white {
  border-color: #f7f4ee;
}

.price-tile__swatch--gold {
  border-color: var(--gold);
}

.price-tile__name {
  font-family: var(--serif);
  font-size: 1.3rem;
}

.price-tile__note {
  color: var(--gold-soft);
  font-size: 0.92rem;
}

.price-tile__price {
  margin-left: auto;
  font-family: var(--serif);
  font-size: 1.7rem;
  white-space: nowrap;
}

.pricing__note {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--sand);
  font-size: 0.92rem;
}

@media (max-width: 900px) {
  .pricing__inner {
    grid-template-columns: 1fr;
  }
}

/* ===== Shop ===== */
.toolbar {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr;
  gap: 0.9rem;
  align-items: end;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.field__label {
  font-size: 0.85rem;
  color: var(--taupe-dark);
}

.field select,
.field input {
  width: 100%;
  min-height: 50px;
  border: 1px solid var(--line);
  background: #fffdf9;
  padding: 0.6rem 0.9rem;
  border-radius: 0;
  font-size: 1rem;
  -webkit-appearance: none;
  appearance: none;
}

.field select {
  background-image: linear-gradient(45deg, transparent 50%, var(--taupe) 50%),
    linear-gradient(135deg, var(--taupe) 50%, transparent 50%);
  background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
  padding-right: 2.4rem;
}

.field--search {
  flex-direction: row;
  align-items: center;
  position: relative;
}

.field--search .icon {
  position: absolute;
  left: 0.9rem;
  color: var(--taupe);
}

.field--search input {
  padding-left: 2.6rem;
}

.field select:focus,
.field input:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 1px var(--gold);
}

.shop__meta {
  margin: 1.4rem 0 1.6rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--taupe-dark);
  font-size: 0.95rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 2.5rem 1.5rem;
}

.empty {
  text-align: center;
  padding: 3rem 1rem;
  border: 1px dashed var(--gold-soft);
  display: grid;
  justify-items: center;
  gap: 1.2rem;
}

@media (max-width: 900px) {
  .toolbar {
    grid-template-columns: 1fr 1fr;
  }

  .field--search {
    grid-column: 1 / -1;
  }
}

@media (max-width: 520px) {
  .toolbar {
    grid-template-columns: 1fr;
  }

  .grid {
    grid-template-columns: 1fr 1fr;
    gap: 2rem 0.8rem;
  }
}

/* ===== Product card ===== */
.card {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.card__media {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  background: var(--sand);
}

.card__media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.7s ease;
}

.card__media:hover img {
  transform: scale(1.035);
}

.card__badge {
  position: absolute;
  left: 0.6rem;
  bottom: 0.6rem;
  background: rgba(250, 246, 239, 0.9);
  font-size: 0.78rem;
  padding: 0.2rem 0.55rem;
}

.card__body {
  display: flex;
  flex-direction: column;
  flex: 1;
  padding-top: 0.9rem;
}

.card__collection {
  font-size: 0.82rem;
  color: var(--taupe);
}

.card__title {
  margin-top: 0.2rem;
  font-size: 1.32rem;
  line-height: 1.2;
}

.card__price {
  margin-top: 0.3rem;
  font-weight: 500;
  font-size: 1.02rem;
}

.card__actions {
  margin-top: auto;
  padding-top: 0.9rem;
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.5rem;
}

@media (max-width: 520px) {
  .card__title {
    font-size: 1.1rem;
  }

  .card__actions .btn {
    white-space: normal;
    text-align: center;
    font-size: 0.86rem;
    padding: 0.55rem 0.5rem;
  }
}

/* ===== Frame picker ===== */
.frame-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-top: 0.6rem;
}

.frame-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  min-height: 36px;
  padding: 0.3rem 0.7rem;
  border: 1px solid var(--line);
  font-size: 0.86rem;
  background: #fffdf9;
  transition: border-color 0.2s ease;
}

.frame-picker--lg .frame-chip {

const FOLDERS = [...new Set([IMAGE_FOLDER, 'images/', '', 'images/images/', 'my-dubai-arts/images/', 'public/images/'])];
const candidates = (file, small) => {
  const list = [];
  FOLDERS.forEach((d) => { if (small) list.push(d + 'thumbs/' + file); list.push(d + file); });
  return list;
};
window.imgFail = (img) => {
  const rest = (img.dataset.next || '').split('|').filter(Boolean);
  if (rest.length) { img.src = rest.shift(); img.dataset.next = rest.join('|'); }
  else if (!img.src.startsWith('data:')) { img.src = PLACEHOLDER; img.alt += ' (placeholder image)'; }
};
const img = (file, alt, small = true, extra = '') => {
  const [first, ...rest] = candidates(file, small);
  return `<img src="${first}" data-next="${rest.join('|')}" alt="${esc(alt)}" ${small ? 'loading="lazy" ' : ''}decoding="async" onerror="imgFail(this)" ${extra}>`;
};

const ICONS = {
  menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  chat: '<path d="M20 11.5a8 8 0 0 1-11.7 7.1L4 20l1.4-4.1A8 8 0 1 1 20 11.5z"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
  truck: '<path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
  package: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9"/>',
  left: '<path d="M15 5l-7 7 7 7"/>',
  right: '<path d="M9 5l7 7-7 7"/>',
  frame: '<rect x="4" y="3" width="16" height="18"/><rect x="8" y="7" width="8" height="10"/>',
};
const icon = (n, s = 20) => `<svg class="icon" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* ----- WhatsApp ----- */
const waLink = (text = 'Hello My Dubai Arts! I would like to know more about your wall art.') =>
  `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
const productUrl = (p) => `${location.origin}${location.pathname}#product/${p.id}`;
const orderLink = (p, f) => {
  const pr = priceOf(f);
  const msg = [
    `Hello My Dubai Arts! I would like to order the '${p.name}' framed artwork.`,
    f ? `Frame: ${f}.` : 'Frame: please advise.',
    pr ? `Price: AED ${pr}.` : '',

/* ----- Pieces ----- */
const photoFor = (p, f) => p.photos.find((ph) => ph[1] === f) || p.photos[0];

const chips = (p, sel, big = false) =>
  p.frames.length
    ? `<div class="frame-picker ${big ? 'frame-picker--lg' : ''}" role="radiogroup" aria-label="Frame style for ${esc(p.name)}">${p.frames
        .map(
          (f) => `<button type="button" role="radio" aria-checked="${f === sel}" class="frame-chip ${f === sel ? 'is-selected' : ''}" data-frame="${esc(f)}"><span class="frame-chip__swatch frame-chip__swatch--${f.replace(/\W+/g, '').toLowerCase()}" aria-hidden="true"></span>${esc(f)}${big && priceOf(f) ? `<span class="frame-chip__price">AED ${priceOf(f)}</span>` : ''}</button>`
        )
        .join('')}</div>`
    : '<p class="frame-picker__review">Frame to be confirmed</p>';

const card = (p, frame) => {
  const f = frame && p.frames.includes(frame) ? frame : p.frames[0];
  const ph = photoFor(p, f);
  const pr = priceOf(f);
  return `<article class="card" data-id="${p.id}" data-current="${esc(f || '')}">
    <button type="button" class="card__media" data-open="${p.id}" aria-label="View details of ${esc(p.name)}">
      ${img(ph[0], ph[2], true, 'width="720" height="900"')}
      ${p.photos.length > 1 ? `<span class="card__badge">${p.photos.length} photos</span>` : ''}
    </button>
    <div class="card__body">
      <p class="card__collection">${esc(colName(p.category))}</p>
      <h3 class="card__title">${esc(p.name)}</h3>
      <p class="card__price">${pr ? 'AED ' + pr : 'Price on request'}</p>
      ${chips(p, f)}
      <div class="card__actions">
        <button type="button" class="btn btn--outline btn--sm" data-open="${p.id}">View Details</button>
        <a class="btn btn--wa btn--sm" href="${orderLink(p, f)}" target="_blank" rel="noopener noreferrer">${icon('chat', 16)} Order on WhatsApp</a>
      </div>
    </div>
  </article>`;
};

const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const scrollToId = (id) => document.getElementById(id)?.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
const menu = $('#mobile-menu');
const menuBtn = $('#menuBtn');
const setMenu = (open) => {
  menu.classList.toggle('is-open', open);
  menuBtn.setAttribute('aria-expanded', open);
  menuBtn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  menuBtn.innerHTML = icon(open ? 'close' : 'menu', 26);
  document.body.classList.toggle('no-scroll', open);
};
menuBtn.addEventListener('click', () => setMenu(!menu.classList.contains('is-open')));
addEventListener('scroll', () => $('#header').classList.toggle('is-scrolled', scrollY > 12), { passive: true });

/* ----- Shop ----- */
const S = { q: '', col: 'all', fg: 'all', sort: 'featured' };
const GROUPS = { white: ['White'], premium: ['Gold', 'Black & Gold'] };

const preferred = (p) => {
  if (GROUPS[S.fg]) return p.frames.find((f) => GROUPS[S.fg].includes(f));
  if (S.sort === 'price-desc') return [...p.frames].sort((a, b) => (priceOf(b) || 0) - (priceOf(a) || 0))[0];
  return p.frames[0];
};

function renderShop() {
  const q = S.q.trim().toLowerCase();
  let list = PRODUCTS.filter((p) => {
    const known = COLLECTIONS.some((c) => c.id === p.category);
    if (S.col === 'uncategorized' ? known : S.col !== 'all' && p.category !== S.col) return false;
    if (GROUPS[S.fg] && !p.frames.some((f) => GROUPS[S.fg].includes(f))) return false;
    return !q || p.name.toLowerCase().includes(q);
  });
  const pr = (p) => priceOf(preferred(p)) ?? Infinity;
  if (S.sort === 'price-asc') list.sort((a, b) => pr(a) - pr(b) || a.name.localeCompare(b.name));
  if (S.sort === 'price-desc') list.sort((a, b) => pr(b) - pr(a) || a.name.localeCompare(b.name));
  if (S.sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
  if (S.sort === 'featured') list.sort((a, b) => Number(!!b.featured) - Number(!!a.featured));

  $('#shop-title').textContent = S.col === 'all' ? 'All artworks' : colName(S.col);
  $('#count').textContent = `${list.length} ${list.length === 1 ? 'artwork' : 'artworks'}`;
  $('#clear').hidden = !(S.q || S.col !== 'all' || S.fg !== 'all' || S.sort !== 'featured');
  $('#grid').innerHTML = list.length
    ? list.map((p) => card(p, preferred(p))).join('')
    : `<div class="empty" style="grid-column:1/-1"><p>No artworks match these filters. Try another name or collection.</p><button type="button" class="btn btn--outline" id="showAll">Show all artworks</button></div>`;
  ['q', 'col', 'fg', 'sort'].forEach((k) => { if ($('#' + k).value !== S[k]) $('#' + k).value = S[k]; });
}
const showShop = (col = 'all') => { S.col = col; renderShop(); requestAnimationFrame(() => scrollToId('shop')); };
const resetShop = () => { Object.assign(S, { q: '', col: 'all', fg: 'all', sort: 'featured' }); renderShop(); };

$('#q').addEventListener('input', (e) => { S.q = e.target.value; renderShop(); });
['col', 'fg', 'sort'].forEach((k) => $('#' + k).addEventListener('change', (e) => { S[k] = e.target.value; renderShop(); }));
$('#clear').addEventListener('click', resetShop);

/* ----- Product details ----- */
let M = null; // { p, frame, active }
let lastFocus = null;

function renderModal() {
  const root = $('#modalRoot');
  if (!M) { root.innerHTML = ''; return; }
  const { p, frame, active } = M;
  const ph = p.photos[active] || p.photos[0];
  const pr = priceOf(frame);
  const many = p.photos.length > 1;
  root.innerHTML = `<div class="modal" id="modalBg">
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="modal__close" id="modalClose" aria-label="Close details">${icon('close', 22)}</button>
      <div class="modal__gallery">
        <div class="modal__main">${img(ph[0], ph[2], false)}
          ${many ? `<button type="button" class="modal__nav modal__nav--prev" data-step="-1" aria-label="Previous photo">${icon('left', 22)}</button><button type="button" class="modal__nav modal__nav--next" data-step="1" aria-label="Next photo">${icon('right', 22)}</button>` : ''}
        </div>
        ${many ? `<div class="modal__thumbs">${p.photos.map((x, i) => `<button type="button" class="modal__thumb ${i === active ? 'is-active' : ''}" data-photo="${i}" aria-label="Show photo ${i + 1}: ${esc(x[1])} frame">${img(x[0], '', true)}</button>`).join('')}</div>` : ''}
      </div>
      <div class="modal__info">
        <p class="modal__collection">${esc(colName(p.category))}</p>
        <h2 id="modal-title" class="modal__title">${esc(p.name)}</h2>
        <p class="modal__price">${pr ? 'AED ' + pr : 'Price on request'}</p>
        <p class="modal__desc">${esc(p.description)}</p>
        <div><p class="modal__label">${p.frames.length > 1 ? 'Choose your frame' : 'Frame'}</p>${chips(p, frame, true)}</div>
        <a class="btn btn--wa btn--lg btn--block" href="${orderLink(p, frame)}" target="_blank" rel="noopener noreferrer">${icon('chat', 20)} Order on WhatsApp${pr ? ', AED ' + pr : ''}</a>
        <div class="modal__delivery">${icon('truck', 22)}<p>Delivered framed to your doorstep in any of the seven emirates, expected within 3 days.</p></div>
      </div>
    </div>
  </div>`;
}
function openProduct(id, frame) {
  const p = PRODUCTS.find((x) => x.id === id);
  if (!p) return;
  const f = frame && p.frames.includes(frame) ? frame : p.frames[0];
  const i = p.photos.findIndex((x) => x[1] === f);
  if (!M) lastFocus = document.activeElement;
  M = { p, frame: f, active: Math.max(0, i) };
  history.replaceState(null, '', '#product/' + id);
  document.body.classList.add('no-scroll');
  renderModal();
  $('#modalClose')?.focus();
}
function closeProduct() {
  M = null;
  history.replaceState(null, '', location.pathname + location.search);
  document.body.classList.remove('no-scroll');
  renderModal();
  lastFocus?.focus?.();
}
const showPhoto = (i) => {
  M.active = (i + M.p.photos.length) % M.p.photos.length;
  const f = M.p.photos[M.active][1];
  if (M.p.frames.includes(f)) M.frame = f;
  renderModal();
};
const chooseFrame = (f) => {
  M.frame = f;
  const i = M.p.photos.findIndex((x) => x[1] === f);
  if (i >= 0) M.active = i;
  renderModal();
};

/* ----- One click handler for the whole page ----- */
document.addEventListener('click', (e) => {
  const t = e.target;
  const go = t.closest('[data-go]');
  if (go) {
    e.preventDefault();
    setMenu(false);
    go.dataset.go === 'shop' ? showShop('all') : scrollToId(go.dataset.go);
    return;
  }
  const tile = t.closest('[data-collection]');
  if (tile) return showShop(tile.dataset.collection);
  if (t.closest('#showAll')) return resetShop();

  if (M) {
    if (t.id === 'modalBg' || t.closest('#modalClose')) return closeProduct();
    const st = t.closest('[data-step]');
    if (st) return showPhoto(M.active + Number(st.dataset.step));
    const ph = t.closest('[data-photo]');
    if (ph) return showPhoto(Number(ph.dataset.photo));
    const fr = t.closest('.modal [data-frame]');
    if (fr) return chooseFrame(fr.dataset.frame);
  }

  const open = t.closest('[data-open]');
  if (open) return openProduct(open.dataset.open, open.closest('.card')?.dataset.current);

  const chip = t.closest('.card [data-frame]');
  if (chip) {
    const c = chip.closest('.card');
    const p = PRODUCTS.find((x) => x.id === c.dataset.id);
    c.outerHTML = card(p, chip.dataset.frame);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (M) closeProduct(); else setMenu(false); }
  if (!M) return;
  if (e.key === 'ArrowRight' && M.p.photos.length > 1) showPhoto(M.active + 1);
  if (e.key === 'ArrowLeft' && M.p.photos.length > 1) showPhoto(M.active - 1);
  if (e.key === 'Tab') {
    const items = $('#modalRoot').querySelectorAll('button, a[href]');
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* ----- Shared product links (#product/id) ----- */
const fromHash = () => {
  const m = location.hash.match(/^#product\/([\w-]+)/);
  if (m) openProduct(m[1]);
};
addEventListener('hashchange', fromHash);
renderShop();
fromHash();

</script>
</body>
