<style>
/* ===== My Dubai Arts — design tokens ===== */
:root {
  --ivory: #faf6ef;
  --cream: #f1e8da;
  --sand: #e3d3bd;
  --taupe: #8a7765;
  --taupe-dark: #5f5144;
  --ink: #1a1714;
  --gold: #b38b4d;
  --gold-soft: #d9c29a;
  --bronze: #7a5b2c;
  --line: rgba(26, 23, 20, 0.14);

  --serif: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --sans: 'Jost', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;

  --wrap: 1240px;
  --gutter: clamp(1.1rem, 4vw, 2.5rem);
  --section: clamp(4rem, 9vw, 7.5rem);
  --header-h: 72px;
}

/* ===== Candy pink theme ===== */
:root {
  --ivory: #ffffff;
  --cream: #fff0f6;
  --sand: #ffd9ea;
  --taupe: #b0708f;
  --taupe-dark: #7d4462;
  --ink: #4a1530;
  --gold: #ff5fa2;
  --gold-soft: #ffc2dd;
  --bronze: #d6337f;
  --line: rgba(214, 51, 127, 0.18);
  --frame-gold: #b38b4d;
}

html .btn--dark { background: var(--bronze); }
html .btn--dark:hover { background: #b8206a; }
html .pricing { background: #ffb3d4; color: #1a1714; }
html .pricing .price-tile__note, html .pricing .pricing__note { color: #1a1714; }
html .pricing .price-tile__swatch--white { box-shadow: 0 0 0 1px rgba(26, 23, 20, 0.25); }
html .btn--outline:hover { background: var(--bronze); border-color: var(--bronze); }

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-padding-top: calc(var(--header-h) + 12px);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--ivory);
  color: var(--ink);
  font-family: var(--sans);
  font-weight: 400;
  font-size: 1.0625rem;
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

body.no-scroll {
  overflow: hidden;
}

img {
  display: block;
  max-width: 100%;
  height: auto;
}

button,
input,
select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  background: none;
  border: 0;
  padding: 0;
}

a {
  color: inherit;
}

p {
  margin: 0;
}

h1,
h2,
h3 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 400;
  line-height: 1.08;
  letter-spacing: -0.01em;
}

:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.skip-link {
  position: absolute;
  left: 1rem;
  top: -100px;
  z-index: 100;
  background: var(--ink);
  color: var(--ivory);
  padding: 0.6rem 1rem;
}

.skip-link:focus {
  top: 1rem;
}

.container {
  width: 100%;
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 0 var(--gutter);
}

.section {
  padding: var(--section) 0;
}

.section-head {
  max-width: 640px;
  margin-bottom: clamp(2rem, 4vw, 3rem);
}

.section-head--row {
  max-width: none;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1.5rem;
  flex-wrap: wrap;
}

.section-title {
  font-size: clamp(2rem, 4.2vw, 3.1rem);
}

.section-sub {
  margin-top: 0.8rem;
  color: var(--taupe-dark);
  max-width: 56ch;
}

/* ===== Buttons ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.55rem;
  min-height: 50px;
  padding: 0.8rem 1.6rem;
  border: 1px solid transparent;
  font-family: var(--sans);
  font-size: 0.98rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  text-decoration: none;
  transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
  white-space: nowrap;
}

.btn--dark {
  background: var(--ink);
  color: var(--ivory);
}

.btn--dark:hover {
  background: var(--taupe-dark);
}

.btn--outline {
  border-color: var(--ink);
  color: var(--ink);
}

.btn--outline:hover {
  background: var(--ink);
  color: var(--ivory);
}

.btn--wa {
  background: var(--bronze);
  color: #fffaf2;
}

.btn--wa:hover {
  background: #5e451f;
}

.btn--sm {
  min-height: 46px;
  padding: 0.6rem 0.9rem;
  font-size: 0.9rem;
}

.btn--lg {
  min-height: 58px;
  font-size: 1.05rem;
  padding: 0.9rem 1.8rem;
}

.btn--block {
  width: 100%;
}

.link-btn {
  text-decoration: underline;
  text-underline-offset: 4px;
  color: var(--taupe-dark);
  min-height: 44px;
}

/* ===== Header ===== */
.header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--ivory);
  border-bottom: 1px solid transparent;
  transition: border-color 0.3s ease;
}

.header.is-scrolled {
  border-bottom-color: var(--line);
}

.header__inner {
  height: var(--header-h);
  display: flex;
  align-items: center;
  gap: 2rem;
}

.wordmark {
  font-family: var(--serif);
  font-size: 1.55rem;
  text-decoration: none;
  white-space: nowrap;
  letter-spacing: 0.01em;
}

.wordmark__my {
  font-style: italic;
  color: var(--gold);
}

.nav {
  display: flex;
  gap: 1.8rem;
  margin-left: auto;
}

.nav__link {
  font-size: 0.95rem;
  padding: 0.5rem 0;
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s ease;
}

.nav__group {
  position: relative;
}

.caret {
  display: inline-block;
  font-size: 0.7em;
  margin-left: 0.15rem;
  transition: transform 0.2s ease;
}

[aria-expanded="true"] > .caret {
  transform: rotate(180deg);
}

.nav__sub {
  position: absolute;
  top: calc(100% + 0.6rem);
  left: 50%;
  transform: translateX(-50%);
  z-index: 50;
  min-width: 250px;
  display: flex;
  flex-direction: column;
  background: var(--ivory);
  border: 1px solid var(--line);
  box-shadow: 0 18px 40px -20px rgba(26, 23, 20, 0.35);
  padding: 0.4rem 0;
}

.nav__sub[hidden] {
  display: none;
}

.nav__sublink,
.mobile-menu__sublink {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.15rem;
  text-align: left;
  font-family: var(--serif);
}

.nav__sublink {
  padding: 0.7rem 1.1rem;
  font-size: 1.1rem;
}

.nav__sublink:hover {
  background: var(--cream);
}

.nav__sublink span,
.mobile-menu__sublink span {
  font-family: var(--sans);
  font-size: 0.8rem;
  color: var(--bronze);
}

.mobile-menu__sub[hidden] {
  display: none;
}

.nav__link:hover {
  border-bottom-color: var(--gold);
}

.header__cta {
  min-height: 44px;
  padding: 0.6rem 1.3rem;
}

.header__toggle {
  display: none;
  margin-left: auto;
  width: 48px;
  height: 48px;
  align-items: center;
  justify-content: center;
}

.mobile-menu {
  display: none;
}

@media (max-width: 900px) {
  .nav,
  .header__cta {
    display: none;
  }

  .header__toggle {
    display: inline-flex;
  }

  .mobile-menu.is-open {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    position: fixed;
    inset: var(--header-h) 0 0 0;
    z-index: 45;
    background: var(--ivory);
    padding: 1.5rem var(--gutter) 2rem;
    overflow-y: auto;
  }

  .mobile-menu__link {
    text-align: left;
    font-family: var(--serif);
    font-size: 1.9rem;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
  }

  .mobile-menu .btn {
    margin-top: 1.5rem;
  }

  .mobile-menu__sub {
    display: flex;
    flex-direction: column;
    padding: 0.3rem 0 0.6rem 1.2rem;
    border-bottom: 1px solid var(--line);
  }

  .mobile-menu__sublink {
    font-size: 1.4rem;
    padding: 0.6rem 0;
  }
}

/* ===== Hero ===== */
.hero {
  padding: clamp(2rem, 5vw, 4.5rem) 0 var(--section);
  background: linear-gradient(180deg, var(--ivory) 0%, var(--cream) 100%);
}

.hero__inner {
  display: grid;
  grid-template-columns: 1fr 1.05fr;
  gap: clamp(2rem, 5vw, 5rem);
  align-items: center;
}

.hero__brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  margin-bottom: clamp(2rem, 4vw, 3.2rem);
}

.hero__logo {
  width: clamp(104px, 12vw, 140px);
  height: auto;
}

.hero__slogan {
  margin-top: 0.9rem;
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(1.05rem, 1.6vw, 1.25rem);
  color: var(--bronze);
}

.hero__kicker {
  color: var(--taupe-dark);
  font-size: 0.98rem;
  margin-bottom: 1.4rem;
  padding-left: 2.6rem;
  position: relative;
}

.hero__kicker::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  width: 1.9rem;
  height: 1px;
  background: var(--gold);
}

.hero__title {
  font-size: clamp(2.7rem, 6vw, 5.1rem);
  line-height: 1.02;
  max-width: 11ch;
}

.hero__text {
  margin-top: 1.5rem;
  font-size: 1.15rem;
  color: var(--taupe-dark);
  max-width: 42ch;
}

.hero__actions {
  margin-top: 2.2rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.9rem;
}

.hero__prices {
  margin-top: 2.2rem;
  display: flex;
  align-items: center;
  gap: 1.2rem;
  color: var(--taupe-dark);
  font-size: 0.95rem;
}

.hero__prices strong {
  white-space: nowrap;
  color: var(--ink);
  font-weight: 500;
  margin-left: 0.3rem;
}

.hero__prices-sep {
  width: 1px;
  height: 1.2rem;
  background: var(--line);
}

.hero__art {
  margin: 0;
  position: relative;
}

.hero__frame {
  position: relative;
  padding: clamp(0.7rem, 1.4vw, 1.1rem);
  background: var(--ivory);
  border: 1px solid var(--gold-soft);
}

.hero__frame::after {
  content: '';
  position: absolute;
  inset: clamp(0.35rem, 0.7vw, 0.55rem);
  border: 1px solid var(--gold);
  pointer-events: none;
}

.hero__frame img {
  width: 100%;
  aspect-ratio: 1.09;
  object-fit: cover;
}

.hero__caption {
  margin-top: 0.8rem;
  font-family: var(--serif);
  font-style: italic;
  color: var(--taupe);
  text-align: right;
}

/* The one orchestrated moment: the hero artwork is "unveiled" on load. */
@media (prefers-reduced-motion: no-preference) {
  .hero__frame img {
    animation: unveil 1.4s cubic-bezier(0.6, 0, 0.2, 1) both;
  }

  .hero__title,
  .hero__text,
  .hero__actions,
  .hero__prices {
    animation: rise 0.9s ease both;
  }

  .hero__text {
    animation-delay: 0.15s;
  }

  .hero__actions {
    animation-delay: 0.3s;
  }

  .hero__prices {
    animation-delay: 0.45s;
  }
}

@keyframes unveil {
  from {
    clip-path: inset(0 0 100% 0);
    transform: scale(1.06);
  }
  to {
    clip-path: inset(0 0 0 0);
    transform: scale(1);
  }
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@media (max-width: 860px) {
  .hero__inner {
    grid-template-columns: 1fr;
  }

  .hero__art {
    order: -1;
  }

  .hero__title {
    max-width: 14ch;
  }

  .hero__actions .btn {
    flex: 1 1 100%;
  }
}

/* ===== Intro ===== */
.intro__grid {
  display: grid;
  grid-template-columns: 0.9fr 1.1fr;
  gap: clamp(2.5rem, 6vw, 6rem);
  align-items: center;
}

.intro__images {
  position: relative;
  min-height: 520px;
}

.intro__img {
  position: absolute;
  object-fit: cover;
  border: 1px solid var(--gold-soft);
  padding: 0.5rem;
  background: var(--ivory);
}

.intro__img--a {
  width: 68%;
  aspect-ratio: 1;
  top: 0;
  left: 0;
}

.intro__img--b {
  width: 52%;
  aspect-ratio: 0.83;
  right: 0;
  bottom: 0;
}

.intro__lead {
  margin-top: 1.4rem;
  font-size: 1.12rem;
  color: var(--taupe-dark);
  max-width: 60ch;
}

.intro__qualities {
  margin-top: 2.5rem;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.8rem;
  border-top: 1px solid var(--line);
  padding-top: 1.8rem;
}

.quality__title {
  font-size: 1.3rem;
  line-height: 1.2;
}

.quality__text {
  margin-top: 0.6rem;
  font-size: 0.96rem;
  color: var(--taupe-dark);
}

@media (max-width: 960px) {
  .intro__grid {
    grid-template-columns: 1fr;
  }

  .intro__images {
    min-height: 0;
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 0.9rem;
    align-items: end;
  }

  .intro__img {
    position: static;
    width: 100%;
  }

  .intro__qualities {
    grid-template-columns: 1fr;
  }
}

/* ===== Featured rail ===== */
.featured {
  background: var(--cream);
}

.featured__rail {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 2.5rem 1.5rem;
}

@media (max-width: 520px) {
  .featured__rail {
    grid-template-columns: 1fr 1fr;
    gap: 2rem 0.8rem;
  }
}

/* ===== Collections ===== */
.collections__duo {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem 1.25rem;
}

.collections__duo .collection-tile__media {
  aspect-ratio: 4 / 3;
}

.collections__duo .collection-tile__name {
  font-size: clamp(1.5rem, 2.6vw, 2rem);
}

@media (max-width: 640px) {
  .collections__duo {
    grid-template-columns: 1fr;
  }

  .collections__duo .collection-tile__blurb {
    display: block;
  }
}

.collections__grid {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1.5rem 1.25rem;
}

.collections__grid > li:first-child {
  grid-column: span 2;
  grid-row: span 2;
}

.collection-tile {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  text-align: left;
}

.collection-tile__media {
  display: block;
  overflow: hidden;
  background: var(--sand);
  aspect-ratio: 4 / 5;
}

.collections__grid > li:first-child .collection-tile__media {
  flex: 1;
  aspect-ratio: auto;
  min-height: 320px;
}

.collections__grid > li:nth-child(6),
.collections__grid > li:nth-child(7) {
  grid-column: span 2;
}

.collections__grid > li:nth-child(6) .collection-tile__media,
.collections__grid > li:nth-child(7) .collection-tile__media {
  aspect-ratio: 16 / 9;
}

/* Ultra Exotic Art: full-width banner closing the grid */
.collections__grid > li:nth-child(8) {
  grid-column: 1 / -1;
}

.collections__grid > li:nth-child(8) .collection-tile__media {
  aspect-ratio: 5 / 2;
}

.collections__grid > li:nth-child(8) .collection-tile__media img {
  object-position: center 30%;
}

.collection-tile__media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.8s ease;
}

.collection-tile:hover .collection-tile__media img {
  transform: scale(1.04);
}

.collection-tile__body {
  display: block;
  padding-top: 0.9rem;
}

.collection-tile__name {
  display: block;
  font-family: var(--serif);
  font-size: 1.3rem;
  line-height: 1.2;
}

.collections__grid > li:first-child .collection-tile__name {
  font-size: 1.7rem;
}

.collection-tile__blurb {
  display: block;
  margin-top: 0.35rem;
  font-size: 0.92rem;
  color: var(--taupe-dark);
}

.collection-tile__count {
  display: inline-block;
  margin-top: 0.5rem;
  font-size: 0.88rem;
  color: var(--bronze);
  border-bottom: 1px solid var(--gold-soft);
}

@media (max-width: 960px) {
  .collections__grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .collections__grid > li:first-child {
    grid-row: auto;
  }

  .collections__grid > li:nth-child(6),
  .collections__grid > li:nth-child(7) {
    grid-column: auto;
  }

  .collections__grid > li:nth-child(6) .collection-tile__media,
  .collections__grid > li:nth-child(7) .collection-tile__media {
    aspect-ratio: 4 / 5;
  }

  .collections__grid > li:first-child .collection-tile__media {
    aspect-ratio: 16 / 10;
    min-height: 0;
  }

  .collections__grid > li:nth-child(8) .collection-tile__media {
    aspect-ratio: 16 / 10;
  }
}

@media (max-width: 480px) {
  .collections__grid {
    gap: 1.25rem 0.8rem;
  }

  .collection-tile__name {
    font-size: 1.08rem;
  }

  .collection-tile__blurb {
    display: none;
  }
}

/* ===== Pricing band ===== */
.pricing {
  background: var(--ink);
  color: var(--ivory);
  padding: clamp(2.2rem, 5vw, 3rem) 0;
}

.pricing__inner {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem 2.5rem;
  align-items: center;
}

.price-tile {
  display: flex;
  align-items: center;
  gap: 1.1rem;
}

.price-tile__swatch {
  width: 46px;
  height: 58px;
  flex: none;
  border: 6px solid;
}

.price-tile__swatch--white {
  border-color: #f7f4ee;
}

.price-tile__swatch--gold {
  border-color: var(--frame-gold, var(--gold));
}
.price-tile__swatch--exotic {
  border-color: var(--frame-gold, var(--gold));
  box-shadow: inset 0 0 0 3px #f7f4ee;
}

.price-tile__name {
  font-family: var(--serif);
  font-size: 1.3rem;
}

.price-tile__note {
  color: var(--gold-soft);
  font-size: 0.92rem;
}

.price-tile__price {
  margin-left: auto;
  font-family: var(--serif);
  font-size: 1.7rem;
  white-space: nowrap;
}

.pricing__note {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--sand);
  font-size: 0.92rem;
}

@media (max-width: 900px) {
  .pricing__inner {
    grid-template-columns: 1fr;
  }
}

/* ===== Shop ===== */
.toolbar {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr;
  gap: 0.9rem;
  align-items: end;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.field__label {
  font-size: 0.85rem;
  color: var(--taupe-dark);
}

.field select,
.field input {
  width: 100%;
  min-height: 50px;
  border: 1px solid var(--line);
  background: #fffdf9;
  padding: 0.6rem 0.9rem;
  border-radius: 0;
  font-size: 1rem;
  -webkit-appearance: none;
  appearance: none;
}

.field select {
  background-image: linear-gradient(45deg, transparent 50%, var(--taupe) 50%),
    linear-gradient(135deg, var(--taupe) 50%, transparent 50%);
  background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
  padding-right: 2.4rem;
}

.field--search {
  flex-direction: row;
  align-items: center;
  position: relative;
}

.field--search .icon {
  position: absolute;
  left: 0.9rem;
  color: var(--taupe);
}

.field--search input {
  padding-left: 2.6rem;
}

.field select:focus,
.field input:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 1px var(--gold);
}

.shop__meta {
  margin: 1.4rem 0 1.6rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--taupe-dark);
  font-size: 0.95rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 2.5rem 1.5rem;
}

.empty {
  text-align: center;
  padding: 3rem 1rem;
  border: 1px dashed var(--gold-soft);
  display: grid;
  justify-items: center;
  gap: 1.2rem;
}

@media (max-width: 900px) {
  .toolbar {
    grid-template-columns: 1fr 1fr;
  }

  .field--search {
    grid-column: 1 / -1;
  }
}

@media (max-width: 520px) {
  .toolbar {
    grid-template-columns: 1fr;
  }

  .grid {
    grid-template-columns: 1fr 1fr;
    gap: 2rem 0.8rem;
  }
}

/* ===== Product card ===== */
.card {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.card__media {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  background: var(--sand);
}

.card__media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.7s ease;
}

.card__media:hover img {
  transform: scale(1.035);
}

.card__badge {
  position: absolute;
  left: 0.6rem;
  bottom: 0.6rem;
  background: rgba(250, 246, 239, 0.9);
  font-size: 0.78rem;
  padding: 0.2rem 0.55rem;
}

.card__body {
  display: flex;
  flex-direction: column;
  flex: 1;
  padding-top: 0.9rem;
}

.card__collection {
  font-size: 0.82rem;
  color: var(--taupe);
}

.card__title {
  margin-top: 0.2rem;
  font-size: 1.32rem;
  line-height: 1.2;
}

.card__price {
  margin-top: 0.3rem;
  font-weight: 500;
  font-size: 1.02rem;
}

.card__actions {
  margin-top: auto;
  padding-top: 0.9rem;
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.5rem;
}

@media (max-width: 520px) {
  .card__title {
    font-size: 1.1rem;
  }

  .card__actions .btn {
    white-space: normal;
    text-align: center;
    font-size: 0.86rem;
    padding: 0.55rem 0.5rem;
  }
}

/* ===== Frame picker ===== */
.frame-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-top: 0.6rem;
}

.frame-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  min-height: 36px;
  padding: 0.3rem 0.7rem;
  border: 1px solid var(--line);
  font-size: 0.86rem;
  background: #fffdf9;
  transition: border-color 0.2s ease;
}

.frame-picker--lg .frame-chip {
  min-height: 52px;
  padding: 0.5rem 1rem;
  font-size: 0.98rem;
}

.frame-chip.is-selected {
  border-color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--ink);
}

.frame-chip__swatch {
  width: 14px;
  height: 18px;
  border: 3px solid;
}

.frame-chip__swatch--white {
  border-color: #e9e4dc;
  background: #fff;
}

.frame-chip__swatch--gold {
  border-color: var(--frame-gold, var(--gold));
}

.frame-chip__swatch--blackgold {
  border-color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--gold);
}

.frame-chip__price {
  color: var(--taupe-dark);
  margin-left: 0.2rem;
}

.size-picker {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem;
  margin-top: 0.6rem;
}

.size-chip {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.1rem;
  padding: 0.6rem 0.65rem;
  border: 1px solid var(--line);
  background: #fffdf9;
  text-align: left;
  min-width: 0;
  transition: border-color 0.2s ease;
}

.size-chip.is-selected {
  border-color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--ink);
}

.size-chip__name {
  font-family: var(--serif);
  font-size: 1.1rem;
}

.size-chip__cm,
.size-chip__price {
  font-size: 0.88rem;
  color: var(--taupe-dark);
}

.size-guide {
  margin-top: 0.6rem;
  font-size: 0.88rem;
  color: var(--taupe-dark);
}

.size-guide summary {
  cursor: pointer;
  color: var(--bronze);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.size-guide ul {
  margin: 0.5rem 0 0.3rem;
  padding-left: 1.1rem;
}

.size-guide strong {
  color: var(--ink);
  font-weight: 500;
}

.frame-picker__review {
  margin-top: 0.6rem;
  font-size: 0.86rem;
  color: var(--bronze);
}

/* ===== Product modal ===== */
.modal {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(26, 23, 20, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(0rem, 3vw, 2rem);
}

@media (prefers-reduced-motion: no-preference) {
  .modal {
    animation: fade 0.25s ease both;
  }

  .modal__dialog {
    animation: rise 0.35s ease both;
  }
}

@keyframes fade {
  from {
    opacity: 0;
  }
}

.modal__dialog {
  position: relative;
  width: 100%;
  max-width: 1080px;
  max-height: 100%;
  overflow-y: auto;
  background: var(--ivory);
  display: grid;
  grid-template-columns: 1.1fr 1fr;
}

.modal__close {
  position: absolute;
  top: 0.6rem;
  right: 0.6rem;
  z-index: 2;
  width: 48px;
  height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--ivory);
}

.modal__gallery {
  background: var(--cream);
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.modal__main {
  position: relative;
  aspect-ratio: 4 / 5;
  background: var(--sand);
}

.modal__main img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.modal__nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 46px;
  height: 46px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(250, 246, 239, 0.9);
}

.modal__nav--prev {
  left: 0.6rem;
}

.modal__nav--next {
  right: 0.6rem;
}

.modal__thumbs {
  display: flex;
  gap: 0.5rem;
  overflow-x: auto;
}

.modal__thumb {
  width: 64px;
  height: 80px;
  flex: none;
  opacity: 0.6;
  border: 1px solid transparent;
}

.modal__thumb.is-active {
  opacity: 1;
  border-color: var(--ink);
}

.modal__thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.modal__info {
  padding: clamp(1.5rem, 4vw, 3rem);
  display: flex;
  flex-direction: column;
  gap: 1.1rem;
}

.modal__collection {
  color: var(--taupe);
  font-size: 0.9rem;
  padding-right: 3rem;
}

.modal__title {
  font-size: clamp(2rem, 4vw, 2.8rem);
}

.modal__price {
  font-family: var(--serif);
  font-size: 1.7rem;
}

.modal__desc {
  color: var(--taupe-dark);
  max-width: 48ch;
}

.modal__label {
  font-size: 0.9rem;
  color: var(--taupe-dark);
}

.modal__delivery {
  display: flex;
  gap: 0.8rem;
  align-items: flex-start;
  padding-top: 1.1rem;
  border-top: 1px solid var(--line);
  font-size: 0.95rem;
  color: var(--taupe-dark);
}

.modal__delivery .icon {
  flex: none;
  color: var(--gold);
  margin-top: 0.15rem;
}

@media (max-width: 820px) {
  .modal {
    align-items: stretch;
    padding: 0;
  }

  .modal__dialog {
    grid-template-columns: 1fr;
    max-height: none;
    height: 100%;
  }

  .modal__main {
    aspect-ratio: 1;
  }
}

/* ===== Delivery ===== */
.delivery {
  background: var(--cream);
  text-align: center;
}

.delivery__inner {
  max-width: 820px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.delivery__icon {
  width: 76px;
  height: 76px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--gold);
  border-radius: 50%;
  color: var(--bronze);
  margin-bottom: 1.6rem;
}

.delivery__text {
  margin-top: 1.2rem;
  font-size: 1.15rem;
  color: var(--taupe-dark);
  max-width: 60ch;
}

.delivery__emirates {
  list-style: none;
  padding: 0;
  margin: 2rem 0 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.5rem;
}

.delivery__emirates li {
  border: 1px solid var(--gold-soft);
  padding: 0.35rem 0.9rem;
  font-size: 0.9rem;
}

/* ===== Contact ===== */
.contact__inner {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: clamp(2rem, 6vw, 5rem);
  align-items: center;
}

.contact__copy > p {
  margin-top: 1.1rem;
  color: var(--taupe-dark);
  max-width: 52ch;
}

.contact__copy .btn {
  margin-top: 2rem;
}

.contact__number {
  font-size: 0.98rem;
}

.contact__number a {
  color: var(--ink);
  text-underline-offset: 4px;
}

.contact__image img {
  width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover;
}

@media (max-width: 820px) {
  .contact__inner {
    grid-template-columns: 1fr;
  }

  .contact__copy .btn {
    width: 100%;
  }
}

.faq__inner {
  max-width: 820px;
}

.faq__head {
  text-align: center;
  margin-inline: auto;
}

.faq__item {
  border-bottom: 1px solid var(--line);
}

.faq__item:first-child {
  border-top: 1px solid var(--line);
}

.faq__item summary {
  cursor: pointer;
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  padding: 1.15rem 0;
  font-family: var(--serif);
  font-size: 1.2rem;
}

.faq__item summary::-webkit-details-marker {
  display: none;
}

.faq__item summary::after {
  content: '+';
  flex: none;
  font-family: var(--sans);
  font-size: 1.5rem;
  color: var(--gold);
  line-height: 1;
}

.faq__item[open] summary::after {
  content: '−';
}

.faq__item p {
  padding: 0 2rem 1.3rem 0;
  color: var(--taupe-dark);
}

/* ===== Showcase ===== */
.showcase {
  background: var(--cream);
}

.showcase__head {
  text-align: center;
  margin-inline: auto;
}

.showcase__grid {
  columns: 3 280px;
  column-gap: 1.25rem;
}

.showcase__item {
  break-inside: avoid;
  margin: 0 0 1.25rem;
}

.showcase__btn {
  display: block;
  width: 100%;
  overflow: hidden;
}

.showcase__item img {
  display: block;
  width: 100%;
  height: auto;
  transition: transform 0.7s ease;
}

.showcase__btn:hover img {
  transform: scale(1.03);
}

.showcase__item figcaption {
  display: flex;
  justify-content: space-between;
  gap: 0.6rem;
  padding-top: 0.6rem;
  font-size: 0.9rem;
}

.showcase__item figcaption strong {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 1.05rem;
}

.showcase__item figcaption span {
  color: var(--bronze);
}

/* ===== Reviews ===== */
.reviews__head {
  text-align: center;
  margin-inline: auto;
}

.reviews__grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 1.25rem;
}

.review {
  margin: 0;
  padding: 1.6rem;
  background: #fffdf9;
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
}

.stars {
  color: var(--gold);
  letter-spacing: 0.12em;
  font-size: 1.05rem;
}

.stars__off {
  color: var(--line);
}

.review__text {
  margin: 0;
  font-family: var(--serif);
  font-size: 1.15rem;
  line-height: 1.45;
}

.review__by {
  font-size: 0.9rem;
  color: var(--taupe-dark);
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem 0.6rem;
  align-items: baseline;
}

.review__by strong {
  color: var(--ink);
  font-weight: 500;
}

.review__art {
  color: var(--bronze);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.reviews__empty {
  max-width: 560px;
  margin: 0 auto;
  padding: 2rem 1.5rem;
  text-align: center;
  border: 1px solid var(--gold-soft);
  background: #fffdf9;
  color: var(--taupe-dark);
}

.reviews__empty-title {
  font-family: var(--serif);
  font-size: 1.4rem;
  color: var(--ink);
  margin-bottom: 0.5rem;
}

.reviews__cta {
  margin-top: 1.8rem;
  text-align: center;
}

/* ===== Email form ===== */
.mail-form {
  margin-top: 2.4rem;
  padding-top: 1.8rem;
  border-top: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
}

.mail-form__title {
  font-family: var(--serif);
  font-size: 1.35rem;
}

.mail-form__row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.9rem;
}

.field textarea {
  width: 100%;
  border: 1px solid var(--line);
  background: #fffdf9;
  padding: 0.7rem 0.9rem;
  border-radius: 0;
  font: inherit;
  resize: vertical;
}

.field textarea:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 1px var(--gold);
}

.mail-form .btn {
  margin-top: 0.3rem;
  align-self: flex-start;
}

.mail-form__trap {
  position: absolute;
  left: -9999px;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.mail-form__ok {
  padding: 0.8rem 1rem;
  border: 1px solid var(--gold-soft);
  background: #fffdf9;
  color: var(--bronze);
}

.mail-form .btn:disabled {
  opacity: 0.6;
  cursor: wait;
}

.mail-form__error a {
  color: inherit;
}

.mail-form__error {
  color: #9b2c2c;
  font-size: 0.9rem;
}

.mail-form__note {
  font-size: 0.85rem;
  color: var(--taupe-dark);
}

.mail-form__note a {
  color: var(--ink);
  text-underline-offset: 3px;
}

@media (max-width: 560px) {
  .mail-form__row {
    grid-template-columns: 1fr;
  }

  .mail-form .btn {
    align-self: stretch;
  }
}

/* ===== Footer ===== */
.footer {
  background: var(--ink);
  color: var(--sand);
  padding: clamp(3rem, 7vw, 5rem) 0 1.5rem;
  font-size: 0.95rem;
}

.footer__grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr;
  gap: 2.5rem;
}

.footer__brand {
  font-family: var(--serif);
  font-size: 1.9rem;
  color: var(--ivory);
}

.footer__about {
  margin-top: 0.8rem;
  max-width: 40ch;
}

.footer__heading {
  color: var(--gold-soft);
  margin-bottom: 0.7rem;
}

.footer__heading--gap {
  margin-top: 1.3rem;
}

.footer__links {
  list-style: none;
  margin: 0;
  padding: 0;
}

.footer__links button {
  min-height: 40px;
  color: var(--sand);
}

.footer__links button:hover,
.footer a:hover {
  color: var(--ivory);
}

.footer a {
  color: var(--sand);
  text-underline-offset: 4px;
}

.footer__base {
  margin-top: 3rem;
  padding-top: 1.3rem;
  border-top: 1px solid rgba(227, 211, 189, 0.2);
  font-size: 0.85rem;
  color: var(--taupe);
}

@media (max-width: 760px) {
  .footer__grid {
    grid-template-columns: 1fr;
  }
}

/* ===== Floating WhatsApp ===== */
.float-wa {
  position: fixed;
  right: max(1rem, env(safe-area-inset-right));
  bottom: max(1rem, env(safe-area-inset-bottom));
  z-index: 30;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--bronze);
  color: #fffaf2;
  box-shadow: 0 8px 24px rgba(26, 23, 20, 0.25);
}

.float-wa:hover {
  background: #5e451f;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}

.intro__qualities > div { min-width: 0; }

.lang-switch {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  min-height: 40px;
  padding: 0 0.6rem;
  font-size: 0.85rem;
  letter-spacing: 0.08em;
  color: var(--taupe-dark);
}

.lang-switch .is-on {
  color: var(--ink);
  font-weight: 500;
  border-bottom: 1px solid var(--gold);
}

.lang-switch--footer {
  margin-top: 0.4rem;
  padding: 0;
  color: inherit;
}

.lang-switch--footer .is-on {
  color: inherit;
}

/* ===== Frame colour previews ===== */
.frame-stage {
  container-type: size;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  background:
    radial-gradient(120% 70% at 50% 0%, rgba(255, 255, 255, 0.55), transparent 60%),
    linear-gradient(180deg, #f3eee7, #e6ded3);
}

.framed {
  display: block;
  padding: 3.4cqmin;
  border-radius: 1px;
  box-shadow:
    0 2.4cqmin 4cqmin -1.6cqmin rgba(40, 28, 15, 0.45),
    0 0.6cqmin 1.2cqmin rgba(40, 28, 15, 0.18);
}

.frame-stage .framed__art {
  display: block;
  width: auto;
  height: auto;
  max-width: 74cqw;
  max-height: 80cqh;
  object-fit: contain;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.14), inset 0 0 0 1px rgba(0, 0, 0, 0.1);
}

.framed--black {
  background: linear-gradient(145deg, #3b3b3b 0%, #151515 16%, #070707 50%, #1a1a1a 84%, #2e2e2e 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.09),
    inset 0 0 0.8cqmin rgba(0, 0, 0, 0.7),
    0 2.4cqmin 4cqmin -1.6cqmin rgba(20, 14, 8, 0.55),
    0 0.6cqmin 1.2cqmin rgba(20, 14, 8, 0.2);
}

.framed--gold {
  background: linear-gradient(135deg, #7c5b22 0%, #d6b25f 16%, #f7e6a6 30%, #b48c3c 48%, #ebd088 64%, #8c692a 82%, #c7a253 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255, 244, 205, 0.45),
    inset 0 0 0.8cqmin rgba(90, 62, 18, 0.55),
    0 2.4cqmin 4cqmin -1.6cqmin rgba(60, 40, 12, 0.45),
    0 0.6cqmin 1.2cqmin rgba(60, 40, 12, 0.18);
}

.framed--white {
  background: linear-gradient(145deg, #ffffff 0%, #f6f3ee 40%, #ebe6de 100%);
  box-shadow:
    inset 0 0 0 1px rgba(0, 0, 0, 0.07),
    inset 0 0 0.8cqmin rgba(120, 104, 84, 0.25),
    0 2.4cqmin 4cqmin -1.6cqmin rgba(60, 45, 30, 0.35),
    0 0.6cqmin 1.2cqmin rgba(60, 45, 30, 0.14);
}

.framed--blackgold {

/* ===== Site logic (no need to edit below) ===== */
const $ = (s, el = document) => el.querySelector(s);
PRODUCTS.forEach((p) => {
  p.firstFrame = p.frames[0];
  p.frames = [...new Set([...FRAME_COLOURS, ...p.frames])];
});
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LANG = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'fr' || q === 'en') { try { localStorage.setItem('mda-lang', q); } catch (e) {} return q; }
  try { const saved = localStorage.getItem('mda-lang'); if (saved === 'fr' || saved === 'en') return saved; } catch (e) {}
  return (navigator.language || '').toLowerCase().startsWith('fr') ? 'fr' : 'en';
})();
const T = (en, fr) => (LANG === 'fr' ? fr : en);
document.documentElement.lang = LANG;
const frameName = (f) => T(f, FR.frames[f] || f);
const sizeName = (s) => T(s, (FR.sizes[s] || [s])[0]);
const sizeFits = (x) => T(x.fits, (FR.sizes[x.name] || [])[1] || x.fits);
const descOf = (p) => T(p.description, FR.descriptions[p.id] || p.description);
const colBlurb = (c) => T(c.blurb, (FR.collections[c.id] || [])[1] || c.blurb);
const aed = (n) => `AED ${n}`;
const colPrice = (p) => p && (COLLECTIONS.find((c) => c.id === p.category) || {}).price;
const sizeOf = (s) => SIZES.find((x) => x.name === s) || SIZES[0];
const priceOf = (f, p, s) => {
  const base = colPrice(p) ?? FRAME_PRICES[f] ?? null;
  return base === null ? null : base + sizeOf(s).extra;
};
const colName = (id) => {
  if (id === 'standard') return T('Standard Collection', 'Collection Standard');
  const c = COLLECTIONS.find((x) => x.id === id);
  if (!c) return T('Uncategorized (to review)', 'Non classé (à revoir)');
  return T(c.name, (FR.collections[c.id] || [])[0] || c.name);
};
const full = (file) => IMAGE_FOLDER + file;
const thumb = (file) => IMAGE_FOLDER + 'thumbs/' + file;
const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><rect width="400" height="500" fill="#EFE6D8"/><rect x="40" y="40" width="320" height="420" fill="none" stroke="#C9B48F" stroke-width="2"/><text x="200" y="255" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#8C7B6B">${LANG === 'fr' ? 'Image bientôt disponible' : 'Image coming soon'}</text></svg>`);

// Looks for each photo in several places, so it still works if the "images"
// folder was uploaded differently (inside another folder, or photos loose at the top).
const FOLDERS = [...new Set([IMAGE_FOLDER, 'images/', '', 'images/images/', 'my-dubai-arts/images/', 'public/images/'])];
const candidates = (file, small) => {
  const list = [];
  FOLDERS.forEach((d) => { if (small) list.push(d + 'thumbs/' + file); list.push(d + file); });
  return list;
};
window.imgFail = (img) => {
  const rest = (img.dataset.next || '').split('|').filter(Boolean);
  if (rest.length) { img.src = rest.shift(); img.dataset.next = rest.join('|'); }
  else if (!img.src.startsWith('data:')) { img.src = PLACEHOLDER; img.alt += ' (placeholder image)'; }
};
const img = (file, alt, small = true, extra = '') => {
  const [first, ...rest] = candidates(file, small);
  return `<img src="${first}" data-next="${rest.join('|')}" alt="${esc(alt)}" ${small ? 'loading="lazy" ' : ''}decoding="async" onerror="imgFail(this)" ${extra}>`;
};

const orderLink = (p, f, s) => {

const frameSlug = (f) => f.replace(/\W+/g, '').toLowerCase();

<section id="contact" class="section contact" aria-labelledby="contact-title">

    <div class="contact__copy">
      <h2 id="contact-title" class="section-title">${T('Order or ask us anything on WhatsApp', 'Commandez ou posez-nous vos questions sur WhatsApp')}</h2>
      <p>${T('Tell us which artwork you love and the frame you would like. We will confirm availability and arrange delivery.', 'Dites-nous quel tableau vous plaît et le cadre que vous souhaitez. Nous confirmons la disponibilité et organisons la livraison.')}</p>
      <a class="btn btn--wa btn--lg" href="${waLink()}" target="_blank" rel="noopener noreferrer">${icon('chat', 20)} ${T('Chat on WhatsApp', 'Discuter sur WhatsApp')}</a>
      <p class="contact__number">WhatsApp: <a href="${waLink()}" target="_blank" rel="noopener noreferrer">${WHATSAPP_DISPLAY}</a></p>
      <form class="mail-form" id="mailForm" novalidate>
        <p class="mail-form__title">${T('Prefer email? Send us your question', 'Vous préférez l’email ? Envoyez-nous votre question')}</p>
        <div class="mail-form__row">
          <label class="field"><span class="field__label">${T('Your name', 'Votre prénom')}</span><input name="name" type="text" autocomplete="name" required></label>
          <label class="field"><span class="field__label">${T('Your email', 'Votre email')}</span><input name="email" type="email" autocomplete="email" required></label>
        </div>
        <label class="field"><span class="field__label">${T('Your question', 'Votre question')}</span><textarea name="message" rows="4" required></textarea></label>
        <input type="checkbox" name="botcheck" class="mail-form__trap" tabindex="-1" autocomplete="off" aria-hidden="true">
        <p class="mail-form__error" id="mailError" role="alert" hidden></p>
        <p class="mail-form__ok" id="mailOk" role="status" hidden></p>
        <button type="submit" class="btn btn--dark" id="mailSend">${icon('mail', 18)} ${WEB3FORMS_KEY ? T('Send my question', 'Envoyer ma question') : T('Send by email', 'Envoyer par email')}</button>
        <p class="mail-form__note">${WEB3FORMS_KEY
          ? T('We will reply to the email address you gave us. You can also write to', 'Nous vous répondrons à l’adresse email indiquée. Vous pouvez aussi écrire à')
          : T('This opens your email app with your message ready to send to', 'Votre application email s’ouvre avec votre message prêt à être envoyé à')} <a href="${mailLink(T('Question for My Dubai Arts', 'Question pour My Dubai Arts'))}">${CONTACT_EMAIL}</a>.</p>
      </form>
    </div>
    <div class="contact__image">${img('manifest-your-dreams-gold.jpg', T('Manifest Your Dreams print in a gold frame in a bright Dubai apartment', 'Tableau Manifest Your Dreams en cadre doré dans un appartement lumineux à Dubaï'))}</div>
  </div>
</section>
</main>

<footer class="footer">
  <div class="container footer__grid">
    <div><p class="footer__brand"><span class="wordmark__my">My</span> Dubai Arts</p><p class="footer__about">${T('Digitally created art, professionally printed and framed, to make your home feel cozy, feminine and full of positive energy.', 'Des œuvres créées numériquement, imprimées et encadrées par des professionnels, pour un intérieur cosy, féminin et plein d’énergie positive.')}</p></div>
    <nav aria-label="Footer"><p class="footer__heading">${T('Explore', 'Explorer')}</p><ul class="footer__links">${NAV.map(([id, l]) => `<li><button type="button" data-go="${id}">${l}</button></li>`).join('')}</ul></nav>
    <div><p class="footer__heading">${T('Delivery', 'Livraison')}</p><p>${T('Across all seven emirates of the UAE, expected within 3 days.', 'Dans les sept émirats, en 3 jours environ.')}</p><p class="footer__heading footer__heading--gap">WhatsApp</p><a href="${waLink()}" target="_blank" rel="noopener noreferrer">${WHATSAPP_DISPLAY}</a><p class="footer__heading footer__heading--gap">Email</p><a href="${mailLink(T('Question for My Dubai Arts', 'Question pour My Dubai Arts'))}">${CONTACT_EMAIL}</a></div>
  </div>
  <div class="container footer__base"><p>© ${new Date().getFullYear()} My Dubai Arts. ${T('All rights reserved.', 'Tous droits réservés.')}</p>${langSwitch('lang-switch--footer')}</div>
</footer>

<a class="float-wa" href="${waLink()}" target="_blank" rel="noopener noreferrer" aria-label="${T('Chat with My Dubai Arts on WhatsApp', 'Discuter avec My Dubai Arts sur WhatsApp')}">${icon('chat', 26)}</a>
<div id="modalRoot"></div>`;

/* ----- Navigation ----- */
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const scrollToId = (id) => document.getElementById(id)?.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
const menu = $('#mobile-menu');
const menuBtn = $('#menuBtn');
const setMenu = (open) => {
  menu.classList.toggle('is-open', open);
  menuBtn.setAttribute('aria-expanded', open);
  menuBtn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  menuBtn.innerHTML = icon(open ? 'close' : 'menu', 26);
  document.body.classList.toggle('no-scroll', open);
};
menuBtn.addEventListener('click', () => setMenu(!menu.classList.contains('is-open')));
addEventListener('scroll', () => $('#header').classList.toggle('is-scrolled', scrollY > 12), { passive: true });

/* ----- Shop ----- */
const S = { q: '', col: 'all', fg: 'all', sort: 'featured' };
const GROUPS = { white: ['White'], premium: ['Black', 'Gold', 'Black & Gold'] };

const preferred = (p) => {
  if (GROUPS[S.fg]) return p.frames.find((f) => GROUPS[S.fg].includes(f));
  if (S.sort === 'price-desc') return [...p.frames].sort((a, b) => (priceOf(b, p) || 0) - (priceOf(a, p) || 0))[0];
  return p.firstFrame;
};

function renderShop() {
  const q = S.q.trim().toLowerCase();
  let list = PRODUCTS.filter((p) => {
    const known = COLLECTIONS.some((c) => c.id === p.category);
    if (S.col === 'standard') { if (p.category === 'ultra-exotic') return false; }
    else if (S.col === 'uncategorized' ? known : S.col !== 'all' && p.category !== S.col) return false;
    if (GROUPS[S.fg] && !p.frames.some((f) => GROUPS[S.fg].includes(f))) return false;
    return !q || p.name.toLowerCase().includes(q);
  });
  const pr = (p) => priceOf(preferred(p), p) ?? Infinity;
  if (S.sort === 'price-asc') list.sort((a, b) => pr(a) - pr(b) || a.name.localeCompare(b.name));
  if (S.sort === 'price-desc') list.sort((a, b) => pr(b) - pr(a) || a.name.localeCompare(b.name));
  if (S.sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
  if (S.sort === 'featured') list.sort((a, b) => Number(!!b.featured) - Number(!!a.featured));

  $('#shop-title').textContent = S.col === 'all' ? T('All artworks', 'Tous les tableaux') : colName(S.col);
  const cp = (COLLECTIONS.find((c) => c.id === S.col) || {}).price;
  $('#shop-sub').textContent = S.col === 'standard'
    ? T('Every artwork comes framed. In Medium, white frames are AED 150 and black or gold frames are AED 200. Large is AED 100 more and Extra Large AED 200 more.', 'Chaque tableau est livré encadré. En taille Moyen, le cadre blanc est à AED 150 et les cadres noir ou doré à AED 200. Le Grand coûte AED 100 de plus et le Très grand AED 200 de plus.')
    : cp
    ? T(`Every artwork comes framed. Every piece in this collection is AED ${cp} in Medium, AED ${cp + SIZES[1].extra} in Large and AED ${cp + SIZES[2].extra} in Extra Large.`,
        `Chaque tableau est livré encadré. Chaque pièce de cette collection coûte AED ${cp} en Moyen, AED ${cp + SIZES[1].extra} en Grand et AED ${cp + SIZES[2].extra} en Très grand.`)
    : T('Every artwork comes framed, in Medium, Large or Extra Large. In Medium, white frames are AED 150, black, gold or premium frames are AED 200 and Ultra Exotic Art pieces are AED 350.',
        'Chaque tableau est livré encadré, en Moyen, Grand ou Très grand. En taille Moyen, le cadre blanc est à AED 150, les cadres noir, doré ou premium à AED 200 et les pièces Ultra Exotic Art à AED 350.');
  $('#count').textContent = `${list.length} ${list.length === 1 ? T('artwork', 'tableau') : T('artworks', 'tableaux')}`;
  $('#clear').hidden = !(S.q || S.col !== 'all' || S.fg !== 'all' || S.sort !== 'featured');
  $('#grid').innerHTML = list.length
    ? list.map((p) => card(p, preferred(p))).join('')
    : `<div class="empty" style="grid-column:1/-1"><p>${T('No artworks match these filters. Try another name or collection.', 'Aucun tableau ne correspond. Essayez un autre nom ou une autre collection.')}</p><button type="button" class="btn btn--outline" id="showAll">${T('Show all artworks', 'Voir tous les tableaux')}</button></div>`;
  ['q', 'col', 'fg', 'sort'].forEach((k) => { if ($('#' + k).value !== S[k]) $('#' + k).value = S[k]; });
}
const showShop = (col = 'all') => { S.col = col; renderShop(); requestAnimationFrame(() => scrollToId('shop')); };
const resetShop = () => { Object.assign(S, { q: '', col: 'all', fg: 'all', sort: 'featured' }); renderShop(); };

$('#q').addEventListener('input', (e) => { S.q = e.target.value; renderShop(); });
['col', 'fg', 'sort'].forEach((k) => $('#' + k).addEventListener('change', (e) => { S[k] = e.target.value; renderShop(); }));
$('#clear').addEventListener('click', resetShop);

/* ----- Email form ----- */
$('#mailForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target;
  const name = f.name.value.trim(), email = f.email.value.trim(), message = f.message.value.trim();
  const err = $('#mailError');
  const problem = !name || !message ? T('Please add your name and your question.', 'Merci d’indiquer votre prénom et votre question.')
    : !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? T('Please enter a valid email address so we can reply.', 'Merci d’indiquer une adresse email valide pour que nous puissions vous répondre.') : '';
  err.hidden = !problem; err.textContent = problem;
  $('#mailOk').hidden = true;
  if (problem) return;
  const subject = T(`Question from ${name}`, `Question de ${name}`);
  const body = `${message}\n\n${T('Name', 'Prénom')}: ${name}\n${T('Email', 'Email')}: ${email}`;
  if (!WEB3FORMS_KEY) { location.href = mailLink(subject, body); return; }
  const btn = $('#mailSend');
  btn.disabled = true;
  fetch('https://api.web3forms.com/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
    body: JSON.stringify({ access_key: WEB3FORMS_KEY, subject: `My Dubai Arts: ${subject}`, from_name: 'My Dubai Arts website', name, email, replyto: email, message, language: LANG, botcheck: f.botcheck.checked })
  })
    .then((r) => r.json())
    .then((res) => {
      if (!res.success) throw new Error(res.message || 'failed');
      f.reset();
      $('#mailOk').textContent = T(`Thank you ${name}! Your question has been sent. We will reply to ${email}.`, `Merci ${name} ! Votre question a bien été envoyée. Nous vous répondrons à ${email}.`);
      $('#mailOk').hidden = false;
    })
    .catch(() => {
      err.innerHTML = `${T('Sorry, your message could not be sent. Please try again, or', 'Désolée, votre message n’a pas pu être envoyé. Réessayez, ou')} <a href="${mailLink(subject, body)}">${T('send it from your email app', 'envoyez-le depuis votre application email')}</a>.`;
      err.hidden = false;
    })
    .finally(() => { btn.disabled = false; });
});

/* ----- Product details ----- */
let M = null; // { p, frame, size, active, preview } preview: show the framed artwork instead of a photo
let lastFocus = null;

function renderModal() {
  const root = $('#modalRoot');
  if (!M) { root.innerHTML = ''; return; }
  const { p, frame, size, active, preview } = M;
  const ph = p.photos[active] || p.photos[0];
  const pr = priceOf(frame, p, size);
  const many = p.photos.length > 1;
  root.innerHTML = `<div class="modal" id="modalBg">
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="modal__close" id="modalClose" aria-label="${T('Close details', 'Fermer')}">${icon('close', 22)}</button>
      <div class="modal__gallery">
        <div class="modal__main">${preview ? stage(p, frame, false, size) : img(ph[0], ph[2], false)}
          ${many ? `<button type="button" class="modal__nav modal__nav--prev" data-step="-1" aria-label="${T('Previous photo', 'Photo précédente')}">${icon('left', 22)}</button><button type="button" class="modal__nav modal__nav--next" data-step="1" aria-label="${T('Next photo', 'Photo suivante')}">${icon('right', 22)}</button>` : ''}
        </div>
        ${many ? `<div class="modal__thumbs">${p.photos.map((x, i) => `<button type="button" class="modal__thumb ${i === active && !preview ? 'is-active' : ''}" data-photo="${i}" aria-label="${T('Show photo', 'Voir la photo')} ${i + 1}">${img(x[0], '', true)}</button>`).join('')}</div>` : ''}
      </div>
      <div class="modal__info">
        <p class="modal__collection">${esc(colName(p.category))}</p>
        <h2 id="modal-title" class="modal__title">${esc(p.name)}</h2>
        <p class="modal__price">${pr ? 'AED ' + pr : T('Price on request', 'Prix sur demande')}</p>
        <p class="modal__desc">${esc(descOf(p))}</p>
        <div><p class="modal__label">${T('Choose your frame colour', 'Choisissez la couleur du cadre')}</p>${frameColours(p, frame, size)}</div>
        <div><p class="modal__label">${T('Choose your size', 'Choisissez la taille')}</p>${sizePicker(p, frame, size)}</div>
        <a class="btn btn--wa btn--lg btn--block" href="${orderLink(p, frame, size)}" target="_blank" rel="noopener noreferrer">${icon('chat', 20)} ${T('Order on WhatsApp', 'Commander sur WhatsApp')}${pr ? ', AED ' + pr : ''}</a>
        <div class="modal__delivery">${icon('truck', 22)}<p>${T('Delivered framed to your doorstep in any of the seven emirates, expected within 3 days.', 'Livré encadré chez vous, dans les sept émirats, en 3 jours environ.')}</p></div>
      </div>
    </div>
  </div>`;
}
function openProduct(id, frame, size) {
  const p = PRODUCTS.find((x) => x.id === id);
  if (!p) return;
  const f = frame && p.frames.includes(frame) ? frame : p.firstFrame;
  const i = p.photos.findIndex((x) => x[1] === f);
  if (!M) lastFocus = document.activeElement;
  M = { p, frame: f, size: sizeOf(size).name, active: Math.max(0, i), preview: i < 0 || !!sizeOf(size).square };
  history.replaceState(null, '', '#product/' + id);
  document.body.classList.add('no-scroll');
  renderModal();
  $('#modalClose')?.focus();
}
function closeProduct() {
  M = null;
  history.replaceState(null, '', location.pathname + location.search);
  document.body.classList.remove('no-scroll');
  renderModal();
  lastFocus?.focus?.();
}
const showPhoto = (i) => {
  M.active = (i + M.p.photos.length) % M.p.photos.length;
  M.preview = false;
  const f = M.p.photos[M.active][1];
  if (M.p.frames.includes(f)) M.frame = f;
  renderModal();
};
const chooseSize = (s) => {
  M.size = s;
  if (sizeOf(s).square) M.preview = true;
  renderModal();
};
const chooseFrame = (f) => {
  M.frame = f;
  M.preview = true;
  renderModal();
};

/* ----- One click handler for the whole page ----- */
document.addEventListener('click', (e) => {
  const t = e.target;
  const ls = t.closest('[data-lang]');
  if (ls) {
    try { localStorage.setItem('mda-lang', ls.dataset.lang); } catch (err) {}
    const u = new URL(location.href);
    u.searchParams.set('lang', ls.dataset.lang);
    location.href = u.toString();
    return;
  }
  const go = t.closest('[data-go]');
  if (go) {
    e.preventDefault();
    setMenu(false);
    go.dataset.go === 'shop' ? showShop('all') : scrollToId(go.dataset.go);
    return;
  }
  const sub = t.closest('[data-sub]');
  if (sub) {
    const panel = document.getElementById(sub.dataset.sub);
    const open = panel.hidden;
    panel.hidden = !open;
    sub.setAttribute('aria-expanded', open);
    return;
  }
  const navSub = $('#nav-sub');
  if (navSub && !navSub.hidden && !t.closest('.nav__group')) { navSub.hidden = true; $('[data-sub="nav-sub"]').setAttribute('aria-expanded', 'false'); }
  const tile = t.closest('[data-collection]');
  if (tile) {
    setMenu(false);
    if (navSub) { navSub.hidden = true; $('[data-sub="nav-sub"]').setAttribute('aria-expanded', 'false'); }
    return showShop(tile.dataset.collection);
  }
  if (t.closest('#showAll')) return resetShop();

  if (M) {
    if (t.id === 'modalBg' || t.closest('#modalClose')) return closeProduct();
    const st = t.closest('[data-step]');
    if (st) return showPhoto(M.active + Number(st.dataset.step));
    const ph = t.closest('[data-photo]');
    if (ph) return showPhoto(Number(ph.dataset.photo));
    const fr = t.closest('.modal [data-frame]');
    if (fr) return chooseFrame(fr.dataset.frame);
    const sz = t.closest('.modal [data-size]');
    if (sz) return chooseSize(sz.dataset.size);
  }

  const open = t.closest('[data-open]');
  if (open) return openProduct(open.dataset.open, open.closest('.card')?.dataset.current);

  const chip = t.closest('.card [data-frame]');
  if (chip) {
    const c = chip.closest('.card');
    const p = PRODUCTS.find((x) => x.id === c.dataset.id);
    c.outerHTML = card(p, chip.dataset.frame);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (M) closeProduct(); else setMenu(false); }
  if (!M) return;
  if (e.key === 'ArrowRight' && M.p.photos.length > 1) showPhoto(M.active + 1);
  if (e.key === 'ArrowLeft' && M.p.photos.length > 1) showPhoto(M.active - 1);
  if (e.key === 'Tab') {
    const items = $('#modalRoot').querySelectorAll('button, a[href], summary');
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* ----- Shared product links (#product/id, or ?product=id&frame=Gold&size=Large from WhatsApp orders) ----- */
const fromHash = () => {
  const m = location.hash.match(/^#product\/([\w-]+)/);
  if (m) openProduct(m[1]);
};
const fromQuery = () => {
  const q = new URLSearchParams(location.search);
  const id = q.get('product');
  if (!id) return false;
  history.replaceState(null, '', location.pathname + (q.get('lang') ? '?lang=' + q.get('lang') : ''));
  openProduct(id, q.get('frame'), q.get('size'));
  return true;
};
addEventListener('hashchange', fromHash);
renderShop();
fromQuery() || fromHash();

</script>
</body>
</html>
